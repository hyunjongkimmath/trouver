# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3
name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install nbdev and build tools
        run: |
          pip install -U "nbdev<3" setuptools wheel

      - name: Install Library and Dependencies
        run: |
          # This replicates the nbdev-ci install logic but stays in your 3.10 env
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check for notebook export synchronization
        run: nbdev_export

      - name: Run nbdev tests
        run: |
          # Use xvfb-run because PyQt6 requires a display buffer to even initialize
          sudo apt-get install -y xvfb
          xvfb-run nbdev_test --timing