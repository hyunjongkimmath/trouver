# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3
name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Install Project
        run: |
          pip install -U pip
          # We install nbdev and your package together
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run nbdev
        run: |
          # Use 'python -m nbdev.cli' to be 100% sure the shell finds it
          python -m nbdev.cli export
          xvfb-run python -m nbdev.cli test --timing --n_workers 0