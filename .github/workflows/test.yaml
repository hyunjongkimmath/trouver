# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3

name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # This will work now because you have a pyproject.toml!

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Install nbdev and project
        run: |
          python -m pip install --upgrade pip
          # In nbdev 3, we install the library directly. 
          # pip will read dependencies from your new pyproject.toml.
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check for notebook export synchronization
        run: python -m nbdev.export

      - name: Run nbdev tests
        run: |
          # Use the module call here too for consistency
          xvfb-run python -m nbdev.test --timing
