# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3

name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Install nbdev and project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run nbdev commands
        run: |
          # Ensure the bin directory where nbdev scripts live is in the PATH
          export PATH=$PATH:$(python -m pip show nbdev | grep Location | cut -d' ' -f2)/../bin
          
          echo "Checking export..."
          nbdev_export
          
          echo "Running tests..."
          # --n_workers 0 is key for stability in CI
          xvfb-run nbdev_test --timing --n_workers 0