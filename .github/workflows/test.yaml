# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3

name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # Removed the cache line to prevent the error you just saw

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel "nbdev<3"

      - name: Install Library and Dependencies
        run: |
          # This will read your settings.ini requirements
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run nbdev tests
        run: |
          # xvfb-run provides the virtual display for PyQt6
          xvfb-run nbdev_test --timing