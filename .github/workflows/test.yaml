# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3

name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4 # Always good to checkout first

      - uses: actions/setup-python@v5 # Updated from v1
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      # This is the "Magic" step to fix the error you're seeing
      - name: Pre-install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools

      - name: Run nbdev CI
        uses: fastai/workflows/nbdev-ci@master