# I am looking at this for how to update the python version.
# https://forums.fast.ai/t/python-version-error-while-running-ci-operations-in-github/98482/3

name: CI
on: [workflow_dispatch, pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb

      - name: Install Project & nbdev
        run: |
          pip install -U pip
          # 1. Install nbdev explicitly so we have the code
          pip install nbdev
          # 2. Install your library (and dependencies like PyQt6/Torch)
          pip install -e ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Check for notebook export synchronization
        run: |
          # Bypass PATH entirely by running the module directly
          # This is the code behind 'nbdev_export'
          python -m nbdev.doclinks

      - name: Run nbdev tests
        run: |
          # This is the code behind 'nbdev_test'
          # --n_workers 0 is CRITICAL to prevent the 'BrokenProcessPool' error you saw earlier
          xvfb-run python -m nbdev.test --timing --n_workers 0