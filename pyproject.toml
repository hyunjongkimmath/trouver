[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trouver"
dynamic = ["version"]
description = "Create and maintain mathematical Obsidian.md notes, and gather data from them to train ML models"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Hyun Jong Kim", email = "hyunjongkim96@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['accelerate', 'arxiv', 'bs4', 'datasets', 'deprecated', 'fastai', 'fastcore', 'fuzzywuzzy', 'instructor', 'jarowinkler', 'natsort', 'numpy>=1.26.0,<2.0.0', 'Levenshtein', 'lmstudio', 'multiset', 'nbdev_ignore', 'openai', 'pandas', 'pydantic', 'pyyaml', 'pylatexenc', 'PyQt6', 'regex', 'scipy', 'sentence-transformers', 'strsimpy', 'thefuzz', 'transformers', 'pathvalidate', 'tiktoken', 'toml', 'tqdm', 'weaviate-client']

[project.urls]
Repository = "https://github.com/hyunjongkimmath/trouver"
Documentation = "https://hyunjongkimmath.github.io/trouver"

[project.entry-points.nbdev]
trouver = "trouver._modidx:d"

[project.optional-dependencies]
dev = ['bert_score', 'fastapi', 'nltk', 'torch', 'pyinstaller', 'pyqt6', 'rouge_score']

[tool.setuptools.dynamic]
version = {attr = "trouver.__version__"}

[tool.setuptools.packages.find]
include = ["trouver"]



[tool.nbdev]
lib_name = "trouver"
nbs_path = "nbs"
recursive = "True"
tst_flags = "tst"
user = "hyunjongkim"